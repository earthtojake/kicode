# Build kicode's wheels of one KiCad nightly, smoke-test them on every platform, and publish them.
#
# kicode is three distributions of one version: kicode-pcb (a wheel per platform: the import package
# kicode, with kicad-cli, KiCad's board support, every library it links, and KiPy), kicode-sch (a wheel per
# platform: KiCad's schematic support, installed into kicode-pcb's folder) and kicode (one py3-none-any
# wheel that requires both: what everyone installs). No wheel of 100 MB or more is ever made or uploaded.
#
# Daily, it follows KiCad: the newest commit KiCad has published a macOS and a Windows nightly of is
# built and, when every platform passes, published as a GitHub prerelease; a commit already released is
# skipped in seconds. Dispatched by hand, it builds a named KiCad commit (or the newest) and publishes only
# when asked. macOS and Windows repackage KiCad's own builds of the commit; Linux builds the same commit
# from source on Debian 12. Each platform's wheels are smoke-tested where they will run: kicode-pcb alone,
# then kicode (Linux also in bare roots with no KiCad, GTK or X11 installed). With `publish`, every wheel
# and the corresponding source go to a GitHub Release named for the version, whose page is the find-links
# index (README.md).
#
# With `pypi` (dispatch only, never the schedule) it promotes a version to PyPI: the wheels of its GitHub
# Release, published already or by the same run with `publish`, unchanged. Without `publish` it builds
# nothing. Each distribution uploads from its own job and environment (pypi-pcb, pypi-sch, pypi): PyPI
# takes one pending trusted publisher per repository, workflow and environment, so three new projects
# need three environments. kicode-pcb goes first and kicode last, so PyPI never lists a kicode whose
# parts it lacks.
#
# A push or pull request runs only `check`: the scripts parse.
name: Build

on:
  workflow_dispatch:
    inputs:
      commit:
        description: "KiCad commit (10+ hex characters); empty for the newest with macOS and Windows nightlies"
        required: false
        default: ""
      kicad_python:
        description: "kicad-python commit or branch whose KiPy the wheels carry"
        required: false
        default: "main"
      publish:
        description: "Publish the GitHub Release"
        type: boolean
        default: false
      pypi:
        description: "Upload the version's GitHub Release to PyPI (with publish, the one this run makes)"
        type: boolean
        default: false
  schedule:
    - cron: "17 6 * * *"
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  check:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: The scripts parse
        run: |
          python3 -m py_compile scripts/*.py tests/*.py src/kicode/*.py
          for script in scripts/*.sh; do bash -n "$script"; done

  resolve:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.build.outputs.build }}
      commit: ${{ steps.nightly.outputs.commit }}
      kicad_version: ${{ steps.nightly.outputs.kicad_version }}
      kicad_full_version: ${{ steps.nightly.outputs.kicad_full_version }}
      version: ${{ steps.nightly.outputs.version }}
      tag: ${{ steps.nightly.outputs.tag }}
      macos_url: ${{ steps.nightly.outputs.macos_url }}
      windows_url: ${{ steps.nightly.outputs.windows_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Find the nightly on every platform
        id: nightly
        env:
          COMMIT: ${{ inputs.commit }}
        run: python3 scripts/resolve_nightly.py ${COMMIT:+--commit "$COMMIT"}
      # Releases are immutable once published, and only a published one counts (the tags endpoint finds no
      # draft): a scheduled run builds only a version not yet published, so a rerun of one skips cleanly; a
      # dispatch builds unless it only promotes, and stops here if it would publish a version published already.
      - name: Build?
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.nightly.outputs.tag }}
          PUBLISH: ${{ inputs.publish }}
          PYPI: ${{ inputs.pypi }}
        run: |
          published=false
          if gh api "repos/${{ github.repository }}/releases/tags/$TAG" >/dev/null 2>&1; then published=true; fi
          if [ "${{ github.event_name }}" = schedule ] && [ "$published" = true ]; then
            echo "$TAG is published already"; echo build=false >> "$GITHUB_OUTPUT"
          elif [ "$PUBLISH" = true ] && [ "$published" = true ]; then
            echo "::error::$TAG is published already, and a published release cannot be replaced"; exit 1
          elif [ "$PYPI" = true ] && [ "$PUBLISH" != true ]; then
            echo "promoting $TAG's release to PyPI: nothing to build"; echo build=false >> "$GITHUB_OUTPUT"
          else
            echo build=true >> "$GITHUB_OUTPUT"
          fi
      - name: KiCad's notices at the commit
        if: steps.build.outputs.build == 'true'
        run: python3 scripts/kicad_licenses.py "${{ steps.nightly.outputs.commit }}" licenses
      - uses: actions/upload-artifact@v7
        if: steps.build.outputs.build == 'true'
        with:
          name: kicad-licenses
          path: licenses/
      - name: kicode's own wheel
        if: steps.build.outputs.build == 'true'
        run: python3 scripts/make_wheel.py --meta --version "${{ steps.nightly.outputs.version }}" --out dist
      - uses: actions/upload-artifact@v7
        if: steps.build.outputs.build == 'true'
        with:
          name: wheel-any
          path: dist/*.whl

  # The KiPy the wheels carry (scripts/vendor_kipy.py): its API changes with the nightly, and the matched client
  # is not on PyPI. Its build generates the protobuf code; the wheel is only an input, never published.
  kicad-python:
    needs: resolve
    if: needs.resolve.outputs.build == 'true'
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.build.outputs.commit }}
    steps:
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Build kicad-python at the commit
        id: build
        env:
          KIPY: ${{ inputs.kicad_python || 'main' }}
        run: |
          git clone --quiet https://gitlab.com/kicad/code/kicad-python.git kicad-python
          git -C kicad-python checkout --quiet "$KIPY"
          git -C kicad-python submodule update --quiet --init --recursive
          echo "commit=$(git -C kicad-python rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          uv build --wheel --out-dir dist kicad-python
          ls -la dist
      - uses: actions/upload-artifact@v7
        with:
          name: kicad-python
          path: dist/*.whl

  macos:
    needs: [resolve, kicad-python]
    runs-on: macos-15
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.resolve.outputs.version }}
      KICAD_VERSION: ${{ needs.resolve.outputs.kicad_version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.2.0
      - uses: actions/download-artifact@v8
        with:
          name: kicad-licenses
          path: licenses
      - uses: actions/download-artifact@v8
        with:
          name: kicad-python
          path: kipy
      - uses: actions/download-artifact@v8
        with:
          name: wheel-any
          path: any
      - name: Download KiCad's macOS nightly
        env:
          URL: ${{ needs.resolve.outputs.macos_url }}
        run: curl -fsSL --retry 5 -o kicad.dmg "$URL"
      - name: Stage kicad-cli (arm64)
        run: scripts/stage_macos.sh kicad.dmg arm64 stage
      - name: KiPy into the package
        run: python3 scripts/vendor_kipy.py kipy/*.whl stage --commit "${{ needs.kicad-python.outputs.commit }}"
      - name: Make the wheels
        run: |
          python3 scripts/make_wheel.py --staged stage --version "$VERSION" --platform macosx_14_0_arm64 \
            --kicad-version "$KICAD_VERSION" --commit "${{ needs.resolve.outputs.commit }}" --kicad-licenses licenses --out dist
          for wheel in dist/*.whl; do
            size=$(wc -c < "$wheel"); echo "$wheel: $size bytes"
            [ "$size" -lt 100000000 ] || { echo "::error::$wheel is $size bytes: PyPI takes no file of 100 MB or more"; exit 1; }
          done
      - name: Smoke tests (kicode-pcb alone, kicode, kicode-pcb again)
        run: |
          uv venv --python 3.12 smoke
          uv pip install --python smoke dist/kicode_pcb-*.whl
          smoke/bin/python tests/smoke.py --installed kicode-pcb --expect-version "$KICAD_VERSION"
          uv pip install --python smoke any/kicode-*.whl dist/kicode_sch-*.whl
          smoke/bin/python tests/smoke.py --installed kicode --expect-version "$KICAD_VERSION"
          uv pip uninstall --python smoke kicode kicode-sch
          smoke/bin/python tests/smoke.py --installed kicode-pcb --no-api --expect-version "$KICAD_VERSION"
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-macos-arm64
          path: dist/*.whl

  # The wheels say macOS 14: run them on 14, not only on the runner that built them.
  macos-14:
    needs: [resolve, macos]
    runs-on: macos-14
    env:
      KICAD_VERSION: ${{ needs.resolve.outputs.kicad_version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.2.0
      - uses: actions/download-artifact@v8
        with:
          name: wheel-macos-arm64
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: wheel-any
          path: any
      - name: Smoke tests on macOS 14
        run: |
          sw_vers
          uv venv --python 3.12 smoke
          uv pip install --python smoke dist/kicode_pcb-*.whl
          smoke/bin/python tests/smoke.py --installed kicode-pcb --expect-version "$KICAD_VERSION"
          uv pip install --python smoke any/kicode-*.whl dist/kicode_sch-*.whl
          smoke/bin/python tests/smoke.py --installed kicode --expect-version "$KICAD_VERSION"

  windows:
    needs: [resolve, kicad-python]
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.resolve.outputs.version }}
      KICAD_VERSION: ${{ needs.resolve.outputs.kicad_version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.2.0
      - uses: actions/download-artifact@v8
        with:
          name: kicad-licenses
          path: licenses
      - uses: actions/download-artifact@v8
        with:
          name: kicad-python
          path: kipy
      - uses: actions/download-artifact@v8
        with:
          name: wheel-any
          path: any
      - name: Download KiCad's Windows nightly
        env:
          URL: ${{ needs.resolve.outputs.windows_url }}
        run: curl -fsSL --retry 5 -o kicad.exe "$URL"
      - name: Stage kicad-cli
        run: python scripts/stage_windows.py kicad.exe stage
      - name: KiPy into the package
        run: python scripts/vendor_kipy.py kipy/*.whl stage --commit "${{ needs.kicad-python.outputs.commit }}"
      - name: Make the wheels
        run: |
          python scripts/make_wheel.py --staged stage --version "$VERSION" --platform win_amd64 \
            --kicad-version "$KICAD_VERSION" --commit "${{ needs.resolve.outputs.commit }}" --kicad-licenses licenses --out dist
          for wheel in dist/*.whl; do
            size=$(wc -c < "$wheel"); echo "$wheel: $size bytes"
            [ "$size" -lt 100000000 ] || { echo "::error::$wheel is $size bytes: PyPI takes no file of 100 MB or more"; exit 1; }
          done
      - name: Smoke tests (kicode-pcb alone, kicode, kicode-pcb again)
        run: |
          uv venv --python 3.12 smoke
          uv pip install --python smoke/Scripts/python.exe dist/kicode_pcb-*.whl
          smoke/Scripts/python.exe tests/smoke.py --installed kicode-pcb --expect-version "$KICAD_VERSION"
          uv pip install --python smoke/Scripts/python.exe any/kicode-*.whl dist/kicode_sch-*.whl
          smoke/Scripts/python.exe tests/smoke.py --installed kicode --expect-version "$KICAD_VERSION"
          uv pip uninstall --python smoke/Scripts/python.exe kicode kicode-sch
          smoke/Scripts/python.exe tests/smoke.py --installed kicode-pcb --no-api --expect-version "$KICAD_VERSION"
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-windows-x86_64
          path: dist/*.whl

  linux:
    needs: [resolve, kicad-python]
    runs-on: ubuntu-latest
    container: debian:12
    timeout-minutes: 330
    env:
      CCACHE_DIR: /ccache
      CCACHE_MAXSIZE: 4G
      KICAD_FULL_VERSION: ${{ needs.resolve.outputs.kicad_full_version }}
      VERSION: ${{ needs.resolve.outputs.version }}
      KICAD_VERSION: ${{ needs.resolve.outputs.kicad_version }}
    steps:
      - name: Tools the steps below need in a bare container
        run: apt-get update -q && apt-get install -y -q --no-install-recommends git ca-certificates zstd python3
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: kicad-licenses
          path: licenses
      - uses: actions/download-artifact@v8
        with:
          name: kicad-python
          path: kipy
      # Each nightly is a new commit, so a build reuses the newest earlier one's objects (wxWidgets' too);
      # saved even when the build fails, so the next attempt starts where this one stopped.
      - uses: actions/cache/restore@v4
        with:
          path: /ccache
          key: ccache-linux-${{ needs.resolve.outputs.commit }}-${{ github.run_id }}
          restore-keys: ccache-linux-
      - name: Build and stage kicad-cli
        run: scripts/build_linux.sh "${{ needs.resolve.outputs.commit }}" stage
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: /ccache
          key: ccache-linux-${{ needs.resolve.outputs.commit }}-${{ github.run_id }}
      - name: KiPy into the package
        run: python3 scripts/vendor_kipy.py kipy/*.whl stage --commit "${{ needs.kicad-python.outputs.commit }}"
      - name: Make the wheels
        run: |
          python3 scripts/make_wheel.py --staged stage --version "$VERSION" --platform manylinux_2_36_x86_64 \
            --kicad-version "$KICAD_VERSION" --commit "${{ needs.resolve.outputs.commit }}" --kicad-licenses licenses --out dist
          for wheel in dist/*.whl; do
            size=$(wc -c < "$wheel"); echo "$wheel: $size bytes"
            [ "$size" -lt 100000000 ] || { echo "::error::$wheel is $size bytes: PyPI takes no file of 100 MB or more"; exit 1; }
          done
      - name: The bundled libraries' source
        run: scripts/linux_sources.sh stage/sources.txt "dist-sources/kicode-$VERSION-linux-bundled-sources.tar" stage/upstream/*
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-linux-x86_64
          path: dist/*.whl
      - uses: actions/upload-artifact@v7
        with:
          name: linux-sources
          path: dist-sources/
          compression-level: 0

  # The Linux wheels in roots that have none of what they bundle: no KiCad, GTK, X11 or OpenGL.
  linux-smoke:
    needs: [resolve, linux]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ["python:3.12-slim-bookworm", "ubuntu:24.04", "fedora:42"]
    container: ${{ matrix.image }}
    env:
      KICAD_VERSION: ${{ needs.resolve.outputs.kicad_version }}
    steps:
      - name: Python and the checkout's tools
        run: |
          if command -v apt-get >/dev/null; then
            apt-get update -q && apt-get install -y -q --no-install-recommends python3 python3-venv ca-certificates git
          elif command -v dnf >/dev/null; then
            dnf install -y -q python3 git
          fi
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: wheel-linux-x86_64
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: wheel-any
          path: any
      - name: Smoke tests in ${{ matrix.image }} (kicode-pcb alone, kicode, kicode-pcb again)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv /smoke
          /smoke/bin/pip install -q dist/kicode_pcb-*.whl
          cli=$(/smoke/bin/python -m kicode)
          unresolved() { for elf in "$@"; do ldd "$elf" | grep "not found" && return 0; done; return 1; }
          if unresolved "$cli" "$(dirname "$cli")"/_*.kiface; then echo "::error::kicode-pcb links what it lacks"; exit 1; fi
          /smoke/bin/python tests/smoke.py --installed kicode-pcb --expect-version "$KICAD_VERSION"
          /smoke/bin/pip install -q any/kicode-*.whl dist/kicode_sch-*.whl
          if unresolved "$(dirname "$cli")"/_*.kiface; then echo "::error::kicode-sch links what it lacks"; exit 1; fi
          /smoke/bin/python tests/smoke.py --installed kicode --expect-version "$KICAD_VERSION"
          /smoke/bin/pip uninstall -y -q kicode kicode-sch
          /smoke/bin/python tests/smoke.py --installed kicode-pcb --no-api --expect-version "$KICAD_VERSION"

  publish:
    needs: [resolve, kicad-python, macos, macos-14, windows, linux, linux-smoke]
    if: inputs.publish || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: linux-sources
          path: sources
      - name: KiCad's source at the commit
        run: |
          commit="${{ needs.resolve.outputs.commit }}"
          curl -fsSL --retry 5 -o "sources/kicad-$commit.tar.gz" \
            "https://gitlab.com/kicad/code/kicad/-/archive/$commit/kicad-$commit.tar.gz"
      # Releases are immutable once published: the release is made a draft with every asset, each asset is
      # checked against the file it came from, and only then is it published. A failure on the way leaves a
      # draft (which the next attempt replaces), never a published release that lacks a file.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.resolve.outputs.tag }}
          COMMIT: ${{ needs.resolve.outputs.commit }}
          FULL: ${{ needs.resolve.outputs.kicad_full_version }}
          KIPY: ${{ needs.kicad-python.outputs.commit }}
        run: |
          ls -la dist sources
          test "$(ls dist/*.whl | wc -l)" -eq 7 || { echo "::error::expected seven wheels"; exit 1; }
          for wheel in dist/*.whl; do
            [ "$(wc -c < "$wheel")" -lt 100000000 ] || { echo "::error::$wheel is 100 MB or more"; exit 1; }
          done
          if gh api "repos/$REPO/releases/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::$TAG is published already, and a published release cannot be replaced"; exit 1
          fi
          for id in $(gh api "repos/$REPO/releases" --paginate --jq ".[] | select(.draft and .tag_name == \"$TAG\") | .id"); do
            echo "deleting draft $id of $TAG, left by an earlier attempt"; gh api -X DELETE "repos/$REPO/releases/$id"
          done
          cat > notes.md <<EOF
          KiCad nightly \`$FULL\`, commit [\`$COMMIT\`](https://gitlab.com/kicad/code/kicad/-/commit/$COMMIT), with KiPy
          (kicad-python) [\`${KIPY:0:10}\`](https://gitlab.com/kicad/code/kicad-python/-/commit/$KIPY) as the \`kicode\` package.

          \`\`\`bash
          uv pip install "kicode==${TAG#v}" --find-links https://github.com/${{ github.repository }}/releases/expanded_assets/$TAG
          \`\`\`

          Three distributions of one version: \`kicode\` (this wheel requires the other two), \`kicode-pcb\` (kicad-cli,
          KiCad's board support and KiPy: the \`kicode\` import package; a wheel per platform) and \`kicode-sch\` (KiCad's
          schematic support, installed into kicode-pcb's folder; a wheel per platform). The source attached: KiCad's at
          the commit, and for the Linux wheels the Debian source package of every library they bundle and wxWidgets'
          release tarball.
          EOF
          gh release create "$TAG" --repo "$REPO" --draft --target "${{ github.sha }}" \
            --title "kicode ${TAG#v}" --notes-file notes.md --prerelease \
            dist/*.whl sources/*
          id=$(gh api "repos/$REPO/releases" --paginate --jq ".[] | select(.draft and .tag_name == \"$TAG\") | .id")
          test "$(echo "$id" | wc -w)" -eq 1 || { echo "::error::expected one draft of $TAG, found: $id"; exit 1; }
          gh api "repos/$REPO/releases/$id/assets" --paginate --jq '.[] | "\(.name) \(.size) \(.state)"' | sort > uploaded.txt
          for file in dist/*.whl sources/*; do echo "$(basename "$file") $(wc -c < "$file" | tr -d ' ') uploaded"; done | sort > expected.txt
          if ! diff expected.txt uploaded.txt; then
            echo "::error::the draft of $TAG does not hold every asset as made: it stays a draft"; exit 1
          fi
          gh release edit "$TAG" --repo "$REPO" --draft=false
          gh api "repos/$REPO/releases/tags/$TAG" --jq '"published \(.tag_name): \(.assets | length) assets, immutable \(.immutable)"'

  # Promotion to PyPI: the release's wheels, unchanged, one distribution per job and environment.
  pypi-pcb:
    needs: [resolve, publish]
    if: >-
      always() && github.event_name == 'workflow_dispatch' && inputs.pypi && needs.resolve.result == 'success' &&
      (needs.publish.result == 'success' || (!inputs.publish && needs.publish.result == 'skipped'))
    runs-on: ubuntu-latest
    environment:
      name: pypi-pcb
      url: https://pypi.org/project/kicode-pcb/${{ needs.resolve.outputs.version }}/
    permissions:
      id-token: write
      contents: read
    steps:
      - name: kicode-pcb's wheels from the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          gh release download "$TAG" --repo "${{ github.repository }}" --pattern "kicode_pcb-$VERSION-*.whl" --dir dist
          for platform in macosx_14_0_arm64 win_amd64 manylinux_2_36_x86_64; do
            test -f "dist/kicode_pcb-$VERSION-py3-none-$platform.whl" || { echo "::error::$TAG has no kicode-pcb wheel for $platform"; exit 1; }
          done
          for wheel in dist/*.whl; do
            size=$(wc -c < "$wheel"); echo "$wheel: $size bytes"
            [ "$size" -lt 100000000 ] || { echo "::error::$wheel is $size bytes: PyPI takes no file of 100 MB or more"; exit 1; }
          done
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  pypi-sch:
    needs: [resolve, pypi-pcb]
    if: always() && needs.pypi-pcb.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: pypi-sch
      url: https://pypi.org/project/kicode-sch/${{ needs.resolve.outputs.version }}/
    permissions:
      id-token: write
      contents: read
    steps:
      - name: kicode-sch's wheels from the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          gh release download "$TAG" --repo "${{ github.repository }}" --pattern "kicode_sch-$VERSION-*.whl" --dir dist
          for platform in macosx_14_0_arm64 win_amd64 manylinux_2_36_x86_64; do
            test -f "dist/kicode_sch-$VERSION-py3-none-$platform.whl" || { echo "::error::$TAG has no kicode-sch wheel for $platform"; exit 1; }
          done
          for wheel in dist/*.whl; do
            size=$(wc -c < "$wheel"); echo "$wheel: $size bytes"
            [ "$size" -lt 100000000 ] || { echo "::error::$wheel is $size bytes: PyPI takes no file of 100 MB or more"; exit 1; }
          done
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  pypi:
    needs: [resolve, pypi-sch]
    if: always() && needs.pypi-sch.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/kicode/${{ needs.resolve.outputs.version }}/
    permissions:
      id-token: write
      contents: read
    steps:
      - name: kicode's wheel from the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          gh release download "$TAG" --repo "${{ github.repository }}" --pattern "kicode-$VERSION-py3-none-any.whl" --dir dist
          test -f "dist/kicode-$VERSION-py3-none-any.whl" || { echo "::error::$TAG has no kicode wheel"; exit 1; }
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
